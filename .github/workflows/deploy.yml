name: Deploy to VPS

on:
  push:
    branches:
      - main

# Un seul déploiement à la fois: si deux push arrivent coup sur coup, on annule
# le déploiement en cours pour ne pas builder deux fois en parallèle sur le VPS.
concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Jeton fourni automatiquement par Actions, valable le temps du job seulement.
          GH_DEPLOY_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Transmet ces deux variables au shell distant (elles n'existent que sur le runner).
          envs: GH_DEPLOY_TOKEN,DEPOT

          # -e: toute commande qui échoue stoppe le déploiement (pas de restart
          # sur un build cassé). -o pipefail: idem à travers un pipe.
          script: |
            set -eo pipefail
            cd /var/www/html/everlink.quentindurant.com

            # Fetch authentifié plutôt qu'anonyme. GitHub a cessé d'accepter les
            # requêtes Git anonymes venant de l'IP de ce VPS : le fetch tombait alors sur
            # une demande d'identifiants et le déploiement s'arrêtait avec
            # « could not read Username for https://github.com ». Le jeton est passé en
            # ligne, jamais écrit dans la configuration git du serveur, et expire à la fin
            # du job. FETCH_HEAD évite de dépendre de l'URL enregistrée dans le remote.
            git fetch "https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/${DEPOT}.git" main
            git reset --hard FETCH_HEAD

            # Pas de package-lock.json versionné (le lockfile du repo est bun.lock),
            # donc npm install et non npm ci. Pour un build 100% reproductible, installer
            # bun sur le VPS et remplacer par: bun install --frozen-lockfile && bun run build
            npm install
            npx prisma generate
            # Migrations + seed via psql (le CLI prisma rejette la chaîne Prisma Postgres).
            # Idempotent : n'applique que les migrations pas encore passées. Voir le script.
            bash scripts/deploy-migrate.sh
            # Un run annulé par `concurrency` laisse son build Next orphelin sur le VPS, qui
            # bloque le suivant. On le tue avant de rebuilder. Le crochet [n] empêche pkill de
            # matcher CE script (sa propre ligne de commande contient le texte du pattern) —
            # sans ça, pkill tuait la session SSH elle-même (exit 143).
            pkill -f "[n]ext build" || true
            # Plafond du tas JavaScript pour le build. La machine n'a que 3,7 Go de RAM et
            # fait tourner plusieurs applications : le build ne tient que grâce au swap.
            # Historique de ce réglage, pour ne pas refaire le tour :
            #   - à 4096 sans swap suffisant : le noyau tuait le processus (exit 137).
            #   - à 2048 avec swap : Node butait sur son propre plafond (heap out of memory).
            # 4096 avec 6 Go de swap laisse le build aboutir. Turbopack alloue en plus hors
            # du tas V8 (code Rust), que ce réglage ne plafonne pas : seul le swap l'absorbe.
            NODE_OPTIONS="--max-old-space-size=4096" npm run build

            # reload SANS --update-env, volontairement. L'app lit son .env elle-même au
            # démarrage (Next charge les fichiers .env) : pm2 n'a aucune variable à lui
            # fournir. --update-env injecterait l'environnement du shell de déploiement dans
            # l'app — c'est ce qui a fait tourner la production sur un DATABASE_URL parasite
            # hérité d'un shell, en échec P1000, alors que le .env était correct.
            # -p 3005: next start ne lit pas PORT depuis .env, le port doit être
            # passé en argument. Le vhost nginx everlink.quentindurant.com proxifie dessus.
            pm2 reload everlink || pm2 start npm --name everlink -- start -- -p 3005
            pm2 save

            # Installe/rafraîchit le cron de suivi des colis (idempotent, ne touche pas les
            # autres lignes crontab). Le secret est lu du .env, jamais imprimé.
            bash scripts/install-crons.sh .env 3005
